<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div class="image-container">
        <img id=headerpic src="porsche1.jpg" alt="https://unsplash.com/photos/grayscale-photo-of-car-on-road-mugDbuNnbd0?utm_source=unsplash&utm_medium=referral&utm_content=creditShareLink">
   
        <div class="overlay-text">
            <h1 class="main-title">Porsche Showroom</h1>
            <p class="sub-title">Innovation and Aesthetic combined</p>
           
        </div>
        
    </div>

<br><br>

<div class="Headeraft">

     <div class="articles">
        <h1 class="HeaderTitle"><b>The 2026 Collection</b></h1>
        
    </div>

    <div class="gallery">
        <div class="images">
        <div class="grid-row active">
        <img id="p1" src="gallery/p1.jpeg" alt="2026 Porsche 911">
        <img id="p2" src="gallery/p2.png" alt="2026 Porsche 718">
        <img id="p3" src="gallery/p3.png" alt="2026 Porsche Taycan">
        </div>
        <div class="grid-row">
        <img id="p4" src="gallery/p4.png" alt="2026 Porsche Panamera">
        <img id="p5" src="gallery/p5.png" alt="2026 Porsche Cayenne">
        <img id="p6" src="gallery/p6.png" alt="2026 Porsche Macan">
        </div>
        <div class="hover-caption"></div>
    </div>
        <button id="nxt-btn" class="overlay-button">&#10095;</button>
    </div>

    <audio id="p1-sound" src="sounds/p1.mp3" preload="auto"></audio>
    <audio id="p2-sound" src="sounds/p2.mp3" preload="auto"></audio>
    <audio id="p3-sound" src="sounds/p3.mp3" preload="auto"></audio>
    <audio id="p4-sound" src="sounds/p4.mp3" preload="auto"></audio>
    <audio id="p5-sound" src="sounds/p5.mp3" preload="auto"></audio>
    <audio id="p6-sound" src="sounds/p6.mp3" preload="auto"></audio>


    <div class="articles">
        <h1 class="HeaderTitle">Classics Reimagined</h1>
        <p class="parags"><i>where Speed meets Cornering</i></p>
    </div>
   
    <script src="drawer"></script>
</div>
</body>
</html>
